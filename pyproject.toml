[project]
name = "duckdb-ortools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "cmake>=3.30,<4",
    "ninja>=1.11",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
